<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Alfa Gamer</title>
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/admin.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/global.js?v=20260905"></script>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="/"> <img src="/images/logo.png" alt="Logo Equipe Alfa" class="logo"> </a>
            <div class="hamburger" id="hamburger">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <nav class="navbar" id="navMenu">
                <button class="user-menu-button" id="openUserDrawer" type="button" title="Abrir opções do usuário">
                    <img src="/images/usefull-icons/person.png" alt="Opções do usuário" height="40">
                </button>
            </nav>
        </div>
    </header>

    <div class="user-dropdown" id="userDrawer" aria-hidden="true">
        <div class="user-dropdown-arrow"></div>
        <nav class="user-dropdown-content" aria-label="Opções da conta">
            <a href="#">Painel administrativo</a>
            <a href="#">Meus dados</a>
            <a href="#">Comentarios</a>
            <button class="logout-btn" id="closeUserDrawer" type="button" onclick="fazerLogout()">Sair</button>
        </nav>
    </div>

    <div class="admin-container">
        <h2>Cadastrar Novo Produto</h2>

        <form id="form-cadastro-produto">
            <div class="form-group">
                <label for="prod-title">Título do Produto *</label>
                <input type="text" id="prod-title" placeholder="Ex: PC Gamer Ryzen 5" required>
            </div>

            <div class="form-group">
                <label for="prod-category">Categoria *</label>
                <fieldset class="checkbox-group" id="prod-category">
                    <label><input type="checkbox" name="prod-category" value="computadores"> Computadores</label>
                    <label><input type="checkbox" name="prod-category" value="perifericos"> Periféricos</label>
                    <label><input type="checkbox" name="prod-category" value="hardware"> Hardware</label>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="prod-subcategory">Subcategoria *</label>
                <div class="category-grid" id="prod-subcategory">
                    <fieldset class="category-container">
                        <legend>Computadores</legend>
                        <label><input type="checkbox" name="prod-subcategory" value="desktops"> Desktops</label>
                        <label><input type="checkbox" name="prod-subcategory" value="notebooks"> Notebooks</label>
                        <label><input type="checkbox" name="prod-subcategory" value="gamer"> Gamers</label>
                        <label><input type="checkbox" name="prod-subcategory" value="office"> Office</label>
                        <label><input type="checkbox" name="prod-subcategory" value="all-in-one"> All-in-One</label>
                    </fieldset>
                    <fieldset class="category-container">
                        <legend>Periféricos</legend>
                        <label><input type="checkbox" name="prod-subcategory" value="mouses"> Mouses</label>
                        <label><input type="checkbox" name="prod-subcategory" value="mousepads"> Mousepads</label>
                        <label><input type="checkbox" name="prod-subcategory" value="teclados"> Teclados</label>
                        <label><input type="checkbox" name="prod-subcategory" value="headsets"> Headsets</label>
                        <label><input type="checkbox" name="prod-subcategory" value="monitores"> Monitores</label>
                        <label><input type="checkbox" name="prod-subcategory" value="webcams"> Webcams</label>
                    </fieldset>
                    <fieldset class="category-container">
                        <legend>Hardware</legend>
                        <label><input type="checkbox" name="prod-subcategory" value="processadores"> Processadores</label>
                        <label><input type="checkbox" name="prod-subcategory" value="placas-de-video"> Placas de vídeo</label>
                        <label><input type="checkbox" name="prod-subcategory" value="placa-mae"> Placas-mãe</label>
                        <label><input type="checkbox" name="prod-subcategory" value="memorias-ram"> Memórias RAM</label>
                        <label><input type="checkbox" name="prod-subcategory" value="armazenamento"> Armazenamento</label>
                        <label><input type="checkbox" name="prod-subcategory" value="fontes"> Fontes</label>
                        <label><input type="checkbox" name="prod-subcategory" value="gabinetes"> Gabinetes</label>
                        <label><input type="checkbox" name="prod-subcategory" value="coolers"> Coolers</label>
                    </fieldset>
                </div>
            </div>

            <div class="form-group">
                <label for="prod-price">Preço (R$) *</label>
                <input type="number" step="0.01" id="prod-price" placeholder="3499.99" required>
            </div>

            <div class="form-group">
                <label for="prod-stock">Estoque Inicial *</label>
                <input type="number" id="prod-stock" placeholder="50" value="1" required>
            </div>

            <div class="form-group">
                <label for="prod-desc">Descrição *</label>
                <textarea id="prod-desc" placeholder="Descrição detalhada do produto" required></textarea>
            </div>

            <div class="form-group">
                <label for="prod-image">URL da Imagem Principal *</label>
                <input type="url" id="prod-image" placeholder="https://exemplo.com/imagem.png" required>
            </div>

            <div class="form-group">
                <label for="prod-tags">Tags</label>
                <input type="text" id="prod-tags" placeholder="gamer, desktop, ryzen, RTX 3060 (separadas por vírgula)">
            </div>

            <button type="submit" id="btn-salvar">Cadastrar Produto</button>
        </form>

    </div>

    <script src="/js/admin.js?v=20260906"></script>
</body>

</html>
